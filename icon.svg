<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0090B3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>

  <!-- Subtle ring decoration -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 229, 255, 0.12)" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Outer Hexagon / Shield Badge -->
  <path d="M256 90 L390 160 L390 320 L256 400 L122 320 L122 160 Z" fill="rgba(20, 27, 45, 0.85)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Play Triangle & Down Arrow Combo Icon -->
  <!-- Play Polygon -->
  <path d="M210 185 L330 256 L210 327 Z" fill="url(#cyanGrad)"/>

  <!-- Downloader Tray & Arrow Accent -->
  <path d="M190 350 L322 350" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="16" fill="#0B0F19" stroke="url(#cyanGrad)" stroke-width="4"/>
</svg>
